# ==============================================================================
# Build System Configuration
# ==============================================================================
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["teralibs"]


# ==============================================================================
# Project Core Metadata & Dynamic Entry Points
# ==============================================================================
[project]
name = "terasploit-framework"
version = "1.0.1-dev"
description = "Advanced modular exploitation framework."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Charlie Castillon", email = "castilloncharlie.a@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Topic :: Security",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "impacket",
    "scapy",
    "paramiko"
]


# ==============================================================================
# Script Distribution (PEP 517 Console Entry Points)
# ==============================================================================
[project.scripts]
# pip generates a portable wrapper shim for each entry point.
# Works correctly for both `pip install` and `pip install -e .`.
teraconsole = "teralibs.terasploit.framework.console.tsf:main"
terax       = "teralibs.tsf.terax.generator:main"


# ==============================================================================
# Global Ruff Settings
# ==============================================================================

[tool.ruff]
# Matches the Python version actually running this project.
target-version = "py313"

# Max line length. The codebase sits comfortably under 100 chars except for
# a handful of shellcode/binary literal lines that must not be wrapped.
line-length = 100

# Lint/format source trees and root-level entry scripts.
include = [
    "teraconsole",
    "terax",
    "teralibs/**/*.py",
    "modules/**/*.py"
]


# ==============================================================================
# Ruff Linting Rules
# ==============================================================================

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors   — spacing, indentation, syntax
    "W",    # pycodestyle warnings — whitespace, blank lines
    "I",    # isort                — import ordering and grouping
    "UP",   # pyupgrade            — modernise to Python 3.13 idioms
    "B",    # flake8-bugbear       — subtle bugs and bad practices
    "SIM",  # flake8-simplify      — suggest simpler equivalents
    "RUF",  # Ruff-specific        — redundant noqa, mutable defaults, etc.
]

ignore = [
    # --- Intentional design choices -------------------------------------------
    "E402",    # Module-level imports not at top of file.
               # The framework uses conditional/deferred imports by design.

    "B904",    # Raise without `from` inside except block.
               # Many handlers re-raise as RuntimeError intentionally.

    "SIM102",  # Collapsible nested if. Framework code sometimes needs the
               # extra nesting for readability in complex dispatch logic.

    "SIM105",  # Use contextlib.suppress instead of try/except/pass.
               # Explicit try/except is clearer in networking/socket code.

    # --- Security rules that are intentional in a pentest framework ---------
    "S602",    # subprocess with shell=True — intentional in _cmd_exec.
    "S603",    # subprocess without shell validation — same reason.
    "S604",    # Call with shell=True — same reason.
    "S701",    # Jinja2 autoescape — not applicable.

    # --- Broad except — used deliberately in module loaders and handlers ----
    "E722",    # Do not use bare `except:` — intentional in catchall handlers.
    "BLE001",  # Blind exception catch — framework catchall patterns are
               # intentional; individual suppressions handle specifics.

    # --- Module system — class-level descriptors are intentional -----------
    "RUF012",  # Mutable class attributes (ARCH, OPTIONS, REFERENCES, etc.)
               # are intentional framework descriptors read via getattr().
               # Annotating with ClassVar would require touching every module.

    # --- Shell transfer state machine ----------------------------------------
    "SIM115",  # open() without context manager in base.py is intentional —
               # the file handle is kept open across multiple method calls
               # inside the transfer state machine and cannot use `with`.

    # --- Line length — shellcode and binary literal lines exceed 100 chars ---
    "E501",    # Line too long — handled by the formatter for normal code;
               # binary/shellcode lines in payload files must not be wrapped.
]

[tool.ruff.lint.per-file-ignores]
# Allow unused imports in __init__.py and package.py re-export files.
# These files exist purely to re-export symbols for the public API.
"__init__.py" = ["F401"]
"package.py"  = ["F401"]


# ==============================================================================
# Ruff Plugin Tooling & Advanced Aesthetics
# ==============================================================================

[tool.ruff.lint.pyupgrade]
# Keep `from __future__ import annotations` removal safe — we don't use it.
keep-runtime-typing = false

[tool.ruff.lint.isort]
# Treat internal libs as first-party so isort groups them separately from
# third-party packages (scapy, impacket, etc.).
known-first-party = ["libs", "modules"]

# Clean double spacing layout for import headers
lines-after-imports = 2
combine-as-imports  = true

[tool.ruff.lint.flake8-tidy-imports]
# Ban relative imports (`from ..libs import x`) to keep the payload module
# loading paths explicitly clean and transparent.
ban-relative-imports = "all"


# ==============================================================================
# Ruff Formatter Settings
# ==============================================================================

[tool.ruff.format]
# Double quotes throughout — the codebase uses ~3160 double vs ~317 single.
quote-style = "double"

# 4-space indentation — standard across all files.
indent-style = "space"

# Trailing commas in multi-line structures — keeps git diffs incredibly clean.
skip-magic-trailing-comma = false

# Automatically style your docstrings to wrap properly and use consistent spacing.
docstring-code-format = true
docstring-code-line-length = 80


# ==============================================================================
# Pyright Type Checker Settings
# ==============================================================================

[tool.pyright]
pythonVersion = "3.13"

# Source roots so pyright resolves `from teralibs.x import y` correctly
# without needing an installed package or sys.path hacks.
extraPaths = ["."]
include    = ["teralibs/**/*.py", "modules**/*.py"]

# Basic mode — reports real errors without demanding annotations everywhere.
# Switch to "standard" once the codebase is fully annotated.
typeCheckingMode = "standard"

# --- Errors we care about -----------------------------------------------------
reportMissingImports    = true
reportUndefinedVariable = true
reportOperatorIssue     = true
reportIndexIssue        = true
reportCallIssue         = true

# --- Relaxed — intentional patterns in a dynamic framework ------------------
reportOptionalMemberAccess = false
reportAttributeAccessIssue = false
reportMissingModuleSource  = false
reportUnknownMemberType    = false
reportUnknownArgumentType  = false
reportUnknownVariableType  = false
reportMissingTypeArgument  = false


# ==============================================================================
# Legacy Pylint Message Controls
# ==============================================================================

[tool.pylint.messages_control]
disable = [
    # Many handlers and dispatch functions require unused arguments to match a
    # common signature, and the dynamic nature of the framework makes it difficult
    # for pylint to infer when this is necessary
    "unused-argument",

    # Line length is handled by the formatter, and some lines
    # (shellcode, binary literals) must exceed 100 chars.
    "line-too-long",

    # Dynamic framework patterns that pylint can't infer properly.
    "not-callable",

    # Many classes are simple data containers or descriptors.
    "too-few-public-methods",

    # Broad excepts are intentional in module loaders and catchall handlers.
    "broad-exception-caught",

    # We need to make sure that everything is passed on properly.
    "useless-parent-delegation",

    # Avoid complexity in the code by dividing it into parts.
    "too-many-locals"
]